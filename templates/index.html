<!DOCTYPE html>
<!-- 1. ESTRUCTURA BÁSICA: El doctype indica que usamos HTML5. 
     El atributo lang="es" ayuda a los buscadores y lectores de pantalla a saber el idioma. -->
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <!-- Asegura que caracteres especiales (tildes, ñ) se vean correctamente. -->
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Agendify | Precisión Ejecutiva</title>

    <!-- 2. USO DE CDNs (Content Delivery Networks): 
         Traemos herramientas externas (Tailwind, Fuentes) desde servidores rápidos en la web. -->
    
    <!-- Cargamos Tailwind CSS: Un framework que nos permite dar estilo usando clases. -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts: Importamos la tipografía 'Inter' para un diseño moderno. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    
    <!-- Material Symbols: Iconos oficiales de Google para botones y menús. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- 3. CONFIGURACIÓN DE TAILWIND (Personalización):
         Aquí definimos nuestra propia "identidad visual" (colores, fuentes y medidas). -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            // Definimos una paleta de colores personalizada basada en Material Design 3.
            "colors": {
                    "secondary-fixed-dim": "#b2c5ff",
                    "surface": "#faf9fb",
                    "inverse-surface": "#2f3033",
                    "inverse-primary": "#b0c8eb",
                    "primary": "#000f22",
                    "on-background": "#1b1c1e",
                    "tertiary-fixed": "#d3e4fe",
                    "tertiary-fixed-dim": "#b7c8e1",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e3e2e5",
                    "on-secondary-fixed-variant": "#0040a2",
                    "primary-container": "#0a2540",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e3e2e5",
                    "outline": "#74777e",
                    "background": "#faf9fb",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-container": "#768dad",
                    "secondary": "#0453cd",
                    "inverse-on-surface": "#f2f0f3",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed": "#0b1c30",
                    "surface-container": "#efedf0",
                    "primary-fixed": "#d2e4ff",
                    "on-tertiary-container": "#7c8ca4",
                    "on-primary-fixed": "#001c37",
                    "on-tertiary-fixed-variant": "#38485d",
                    "on-primary-fixed-variant": "#314865",
                    "surface-dim": "#dbd9dc",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#43474d",
                    "on-error-container": "#93000a",
                    "tertiary": "#000f22",
                    "surface-container-low": "#f5f3f6",
                    "on-secondary": "#ffffff",
                    "tertiary-container": "#142538",
                    "primary-fixed-dim": "#b0c8eb",
                    "surface-tint": "#49607e",
                    "surface-bright": "#faf9fb",
                    "surface-container-high": "#e9e8ea",
                    "on-primary": "#ffffff",
                    "on-surface": "#1b1c1e",
                    "on-secondary-container": "#fefcff",
                    "secondary-fixed": "#dae2ff",
                    "secondary-container": "#356ee7",
                    "outline-variant": "#c4c6ce",
                    "on-secondary-fixed": "#001848"
            },
            // Radios de borde personalizados para botones y tarjetas.
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            // Sistema de espaciado para mantener la consistencia (margen, padding, etc).
            "spacing": {
                    "sm": "8px",
                    "lg": "24px",
                    "unit": "8px",
                    "xl": "32px",
                    "container-max": "1440px",
                    "gutter": "24px",
                    "xxl": "64px",
                    "md": "16px",
                    "margin-page": "40px",
                    "xs": "4px"
            },
            // Tipografías asignadas a roles específicos de la interfaz.
            "fontFamily": {
                    "h2": ["Inter"],
                    "label-bold": ["Inter"],
                    "body-md": ["Inter"],
                    "caption": ["Inter"],
                    "h1": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-lg": ["Inter"],
                    "h3": ["Inter"]
            },
            "fontSize": {
                    "h2": ["32px", {"lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-bold": ["14px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                    "caption": ["12px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400"}],
                    "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                    "h3": ["24px", {"lineHeight": "1.3", "letterSpacing": "0", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
    
    <!-- 4. ESTILOS CSS PERSONALIZADOS:
         Usamos esto para detalles que Tailwind no maneja por defecto, como gradientes complejos. -->
    <style>
      /* Configuración para que los iconos se vean correctamente */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Gradientes decorativos para dar un toque "ejecutivo" y premium */
      .bg-executive-gradient {
        background: linear-gradient(135deg, #0a2540 0%, #0453cd 100%);
      }
      .btn-primary-gradient {
        background: linear-gradient(135deg, #0a2540 0%, #0453cd 100%);
      }
      /* Sombras suaves para dar profundidad a las tarjetas */
      .form-shadow {
        box-shadow: 0px 10px 25px -5px rgba(10, 37, 64, 0.08);
      }
      /* Clases para transiciones de opacidad suaves (útil para el cambio de vistas) */
      [v-cloak] { display: none; }
      .fade-enter-active, .fade-leave-active { transition: opacity 0.3s; }
      .fade-enter, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen">
    <!-- 5. EL CONTENEDOR PRINCIPAL (#app):
         Este es el "lienzo" donde JavaScript dibujará todas nuestras pantallas. 
         Al ser una SPA (Single Page Application), solo tenemos este archivo HTML
         y el contenido cambia dinámicamente dentro de este DIV. -->
    <div id="app">
        <!-- El contenido será inyectado por static/js/main.js -->
    </div>

    <!-- Modal de Confirmación Premium en Interfaz -->
    <div id="confirmModal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-md transition-all duration-300">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-md overflow-hidden flex flex-col p-lg relative transform scale-95 transition-transform duration-300">
            <div class="flex items-start gap-md mb-md">
                <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-600 shrink-0">
                    <span class="material-symbols-outlined text-[28px]">warning</span>
                </div>
                <div class="space-y-xs">
                    <h3 class="text-lg font-bold text-blue-950" id="confirmModalTitle">¿Está seguro?</h3>
                    <p class="text-sm text-slate-500 font-body-sm leading-relaxed" id="confirmModalMessage">Esta acción es permanente y no se puede deshacer.</p>
                </div>
            </div>
            <div class="flex justify-end gap-sm mt-md">
                <button id="confirmModalCancelBtn" class="px-md py-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs transition-all">Cancelar</button>
                <button id="confirmModalConfirmBtn" class="px-md py-sm bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg text-xs shadow-sm hover:shadow-md transition-all">Eliminar Registro</button>
            </div>
        </div>
    </div>

    <!-- Cargamos nuestra lógica de JavaScript al final para asegurar que el HTML ya exista -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
